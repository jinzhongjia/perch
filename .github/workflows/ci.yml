name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test
      - run: zig build examples

  # Drives the library through a mock StatusNotifierItem host, so the protocol
  # behaviours real desktops differ on are covered without installing any.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: sudo apt-get update && sudo apt-get install -y dbus-x11
      # A private bus: a real session would already own the watcher name.
      - run: dbus-run-session -- zig build integration

  check:
    # Linking AppKit/UserNotifications requires Apple's SDK. This host can also
    # cross-link Linux and Windows through Zig's bundled target support.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      # Compile every backend for every supported target from one host.
      - run: zig build check
      - run: zig fmt --check .
